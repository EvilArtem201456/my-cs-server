<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastDL - CS 1.6 Сервер</title>
    <style>
        /* Стили (оставляем прежние, они уже хорошие) */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#1a1a2e; color:#e0e0e0; padding:20px; min-height:100vh; }
        .container { max-width:1000px; margin:0 auto; background:#16213e; border-radius:12px; padding:30px; box-shadow:0 8px 32px rgba(0,0,0,0.5); }
        h1 { color:#e94560; border-bottom:2px solid #e94560; padding-bottom:15px; margin-bottom:25px; font-weight:300; letter-spacing:1px; }
        .path-info { background:#0f3460; padding:12px 18px; border-radius:8px; margin-bottom:25px; font-size:14px; color:#aaa; word-break:break-all; border-left:4px solid #e94560; }
        .path-info strong { color:#fff; }
        .file-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
        .file-item { background:#1a1a2e; padding:12px 16px; border-radius:8px; display:flex; align-items:center; justify-content:space-between; transition:all 0.2s ease; border:1px solid transparent; }
        .file-item:hover { background:#0f3460; border-color:#e94560; transform:translateY(-2px); box-shadow:0 4px 12px rgba(233,69,96,0.2); }
        .file-item a { color:#4fc3f7; text-decoration:none; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; }
        .file-item a:hover { color:#fff; text-decoration:underline; }
        .file-size { font-size:12px; color:#888; background:#16213e; padding:2px 8px; border-radius:12px; white-space:nowrap; }
        .empty-folder { grid-column:1/-1; text-align:center; padding:40px 20px; color:#666; font-style:italic; }
        .footer { margin-top:30px; text-align:center; font-size:13px; color:#555; border-top:1px solid #0f3460; padding-top:20px; }
        .badge { display:inline-block; background:#e94560; color:#fff; font-size:10px; padding:2px 8px; border-radius:12px; margin-left:8px; vertical-align:middle; }
        @media (max-width:600px) { .container { padding:15px; } .file-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 FastDL Storage <span class="badge">CS 1.6</span></h1>
    <div class="path-info">
        <strong>🔗 Базовый URL:</strong>
        <span id="baseUrlDisplay">https://EvilArtem201456.github.io/my-cs-server-fastdl/</span>
    </div>
    <div id="fileList" class="file-grid">
        <div class="empty-folder">⏳ Загрузка списка файлов...</div>
    </div>
    <div class="footer">
        🖱️ <strong>Клик по файлу</strong> — откроется для просмотра.<br>
        🔗 Правой кнопкой → <strong>"Сохранить ссылку как"</strong> — скачать.
    </div>
</div>

<script>
    (function() {
        // ========== НАСТРОЙКИ ==========
        const REPO_OWNER = 'EvilArtem201456';
        const REPO_NAME = 'my-cs-server-fastdl';
        const BRANCH = 'main';            // ваша ветка
        const BASE_URL = 'https://EvilArtem201456.github.io/my-cs-server-fastdl/';
        // ================================

        const fileListEl = document.getElementById('fileList');
        document.getElementById('baseUrlDisplay').textContent = BASE_URL;

        // Функция для получения размера (из API не приходит, оставим прочерк)
        function formatSize(bytes) { return bytes ? (bytes/1024).toFixed(1)+' KB' : '—'; }

        async function fetchFileList() {
            try {
                // Один запрос к GitHub API – получаем всё дерево рекурсивно
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;

                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        // Можно добавить User-Agent (но необязательно)
                        'User-Agent': 'FastDL-Viewer'
                    }
                });

                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Превышен лимит запросов к GitHub API (60 в час). Подождите немного.');
                    }
                    throw new Error(`GitHub API вернул ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                // data.tree – массив объектов { path, type, size, ... }
                if (!data.tree || data.tree.length === 0) {
                    fileListEl.innerHTML = `<div class="empty-folder">📂 Репозиторий пуст.</div>`;
                    return;
                }

                // Фильтруем только файлы (не папки) и исключаем служебные
                const files = data.tree
                    .filter(item => item.type === 'blob')                  // только файлы
                    .filter(item => !['index.html', '.gitignore', 'README.md', 'files.json'].includes(item.path))
                    .sort((a, b) => a.path.localeCompare(b.path));

                if (files.length === 0) {
                    fileListEl.innerHTML = `<div class="empty-folder">📂 Нет файлов для отображения.</div>`;
                    return;
                }

                // Генерируем HTML
                let html = '';
                files.forEach(file => {
                    // Полный путь к файлу (он будет подставлен в URL)
                    const filePath = file.path;
                    // Ссылка для скачивания (через GitHub Pages)
                    const fileUrl = `${BASE_URL}${filePath}`;
                    // Размер (если есть)
                    const size = file.size ? formatSize(file.size) : '—';

                    html += `
                        <div class="file-item">
                            <a href="${fileUrl}" target="_blank" title="${filePath}">
                                📄 ${filePath}
                            </a>
                            <span class="file-size">${size}</span>
                        </div>
                    `;
                });

                fileListEl.innerHTML = html;

            } catch (error) {
                console.error('Ошибка:', error);
                fileListEl.innerHTML = `
                    <div class="empty-folder" style="color:#e94560;">
                        ❌ Не удалось загрузить список файлов.<br>
                        <span style="font-size:13px; color:#888;">${error.message}</span>
                    </div>
                `;
            }
        }

        fetchFileList();
    })();
</script>
</body>
</html>
